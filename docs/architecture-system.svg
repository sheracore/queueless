<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 860" role="img" aria-label="QueueLess system: clients call the queue service, which writes changes and outbox events in one transaction; a relay publishes them to Kafka; the notification worker consumes them, sends SMS and records them; failures go to retry topics and a dead-letter topic." class="dia"><title>QueueLess system: clients call the queue service, which writes changes and outbox events in one transaction; a relay publishes them to Kafka; the notification worker consumes them, sends SMS and records them; failures go to retry topics and a dead-letter topic.</title><style>
.canvas{fill:#F7F8FA}
text{font-family:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;fill:#18202B}
.t-title{font-size:14px;font-weight:600}.t-sub{font-size:11px;fill:#5F6B7C;font-family:'IBM Plex Mono',ui-monospace,monospace}
.t-lbl{font-size:12px;fill:#4A5566}.t-grp{font-size:11px;letter-spacing:.12em;font-weight:600;fill:#6B7686}
.t-mono{font-size:12px;font-family:'IBM Plex Mono',ui-monospace,monospace;font-weight:600}
.t-mono-bad{font-size:12px;font-family:'IBM Plex Mono',ui-monospace,monospace;font-weight:600;fill:#C2362F}
.t-bad{font-size:12px;fill:#C2362F}.t-ok{font-size:12px;fill:#2E7D32}.t-soft{font-size:12px;fill:#6B7686}
.grp{fill:none;stroke:#C9D0DA;stroke-dasharray:6 5;stroke-width:1.2}
.box-actor{fill:#EEF1F5;stroke:#C9D0DA}
.box-svc{fill:#E8EEFC;stroke:#2F5BD3;stroke-width:1.4}.box-db{fill:#E3F2EF;stroke:#1F7A6B;stroke-width:1.4}
.box-log{fill:#FBF1DF;stroke:#B7791F;stroke-width:1.4}.box-dlq{fill:#FBE7E5;stroke:#C2362F;stroke-width:1.4}
.box-ext{fill:#F7F8FA;stroke:#6B7686;stroke-dasharray:5 4;stroke-width:1.2}
.box-final{fill:#18202B;stroke:#18202B}.box-final+text{fill:#F7F8FA}
.row{fill:#FFFFFF;stroke:#C9D0DA}.row-hl{fill:#FBF1DF;stroke:#B7791F}.row-bad{fill:#FBE7E5;stroke:#C2362F}
.cell{fill:#B7791F;opacity:.55}.cell-empty{fill:none;stroke:#B7791F;stroke-dasharray:3 3}
.ln{fill:none;stroke:#4A5566;stroke-width:1.5}.ln-bad{fill:none;stroke:#C2362F;stroke-width:1.5;stroke-dasharray:6 4}
.ln-soft{fill:none;stroke:#6B7686;stroke-width:1.3;stroke-dasharray:3 4}.ln-ok{fill:none;stroke:#2E7D32;stroke-width:1.5}
.m-ln{fill:#4A5566}.m-bad{fill:#C2362F}.m-soft{fill:#6B7686}.m-ok{fill:#2E7D32}
</style><rect width="1240" height="860" class="canvas"/><defs><marker id="f1a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="m-ln"/></marker><marker id="f1ar" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" class="m-ln"/></marker><marker id="f1b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="m-bad"/></marker><marker id="f1br" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" class="m-bad"/></marker><marker id="f1s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="m-soft"/></marker><marker id="f1sr" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" class="m-soft"/></marker><marker id="f1o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="m-ok"/></marker><marker id="f1or" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" class="m-ok"/></marker></defs><rect x="20" y="12" width="1200" height="40" rx="8" class="box-actor"/><text x="620" y="37" class="t-title" text-anchor="middle">Clients · customer app, staff screen (HTTP)</text><rect x="20" y="104" width="400" height="436" rx="14" class="grp"/><text x="36" y="128" class="t-grp" text-anchor="start">QUEUE SERVICE</text><rect x="460" y="104" width="360" height="736" rx="14" class="grp"/><text x="476" y="128" class="t-grp" text-anchor="start">KAFKA 4.1 · KRAFT · 1 BROKER</text><rect x="860" y="104" width="360" height="736" rx="14" class="grp"/><text x="876" y="128" class="t-grp" text-anchor="start">NOTIFICATION SERVICE</text><polyline points="220,52 220,144" class="ln" marker-end="url(#f1a)"/><text x="230" y="82" class="t-lbl" text-anchor="start">POST join · call-next · serve · no-show · leave</text><rect x="60" y="144" width="320" height="64" rx="8" class="box-svc"/><text x="220.0" y="173.0" class="t-title" text-anchor="middle">queue-service</text><text x="220.0" y="191.0" class="t-sub" text-anchor="middle">FastAPI · :8000 · ticket state machine</text><polyline points="150,208 150,268" class="ln" marker-end="url(#f1a)"/><text x="160" y="243" class="t-lbl" text-anchor="start">1 transaction: change + outbox row</text><rect x="60" y="268" width="320" height="150" rx="8" class="box-db"/><text x="76" y="292" class="t-title" text-anchor="start">queueless</text><text x="364" y="292" class="t-sub" text-anchor="end">PostgreSQL · :5433</text><rect x="76" y="310" width="288" height="24" rx="4" class="row"/><text x="86" y="326" class="t-mono" text-anchor="start">queues</text><text x="354" y="326" class="t-sub" text-anchor="end">next_ticket_number · row lock</text><rect x="76" y="342" width="288" height="24" rx="4" class="row"/><text x="86" y="358" class="t-mono" text-anchor="start">queue_entries</text><text x="354" y="358" class="t-sub" text-anchor="end">WAITING → CALLED → …</text><rect x="76" y="374" width="288" height="24" rx="4" class="row-hl"/><text x="86" y="390" class="t-mono" text-anchor="start">outbox_events</text><text x="354" y="390" class="t-sub" text-anchor="end">NULL = not yet sent</text><polyline points="300,466 300,418" class="ln" marker-end="url(#f1a)" marker-start="url(#f1ar)"/><text x="290" y="446" class="t-lbl" text-anchor="end">reads pending · marks published_at</text><rect x="60" y="466" width="320" height="56" rx="8" class="box-svc"/><text x="220.0" y="491.0" class="t-title" text-anchor="middle">queue-outbox-relay</text><text x="220.0" y="509.0" class="t-sub" text-anchor="middle">batch 100 · polls every 0.5 s · 1 instance</text><polyline points="380,494 490,494" class="ln" marker-end="url(#f1a)"/><text x="435" y="486" class="t-lbl" text-anchor="middle">produce</text><text x="435" y="512" class="t-sub" text-anchor="middle">acks=all</text><rect x="490" y="152" width="300" height="52" rx="8" class="box-ext"/><text x="640" y="174" class="t-title" text-anchor="middle">kafka-init (one-shot)</text><text x="640" y="192" class="t-sub" text-anchor="middle">creates the 4 topics, then exits</text><text x="640" y="236" class="t-grp" text-anchor="middle">listeners</text><text x="640" y="256" class="t-mono" text-anchor="middle">containers → kafka:9092</text><text x="640" y="276" class="t-mono" text-anchor="middle">your machine → localhost:9094</text><text x="640" y="306" class="t-sub" text-anchor="middle">optional UI: kafka-ui :8080 (--profile tools)</text><rect x="490" y="430" width="300" height="130" rx="8" class="box-log"/><text x="506" y="454" class="t-title" text-anchor="start">queue.events</text><text x="774" y="454" class="t-sub" text-anchor="end">3 partitions · 7 days</text><text x="506" y="483" class="t-mono" text-anchor="start">P0</text><rect x="532" y="468" width="24" height="20" rx="3" class="cell"/><rect x="559" y="468" width="24" height="20" rx="3" class="cell"/><rect x="586" y="468" width="24" height="20" rx="3" class="cell"/><rect x="613" y="468" width="24" height="20" rx="3" class="cell"/><rect x="640" y="468" width="24" height="20" rx="3" class="cell"/><rect x="667" y="468" width="24" height="20" rx="3" class="cell"/><rect x="694" y="468" width="24" height="20" rx="3" class="cell"/><rect x="721" y="468" width="24" height="20" rx="3" class="cell-empty"/><rect x="748" y="468" width="24" height="20" rx="3" class="cell-empty"/><text x="506" y="511" class="t-mono" text-anchor="start">P1</text><rect x="532" y="496" width="24" height="20" rx="3" class="cell"/><rect x="559" y="496" width="24" height="20" rx="3" class="cell"/><rect x="586" y="496" width="24" height="20" rx="3" class="cell"/><rect x="613" y="496" width="24" height="20" rx="3" class="cell"/><rect x="640" y="496" width="24" height="20" rx="3" class="cell"/><rect x="667" y="496" width="24" height="20" rx="3" class="cell-empty"/><rect x="694" y="496" width="24" height="20" rx="3" class="cell-empty"/><rect x="721" y="496" width="24" height="20" rx="3" class="cell-empty"/><rect x="748" y="496" width="24" height="20" rx="3" class="cell-empty"/><text x="506" y="539" class="t-mono" text-anchor="start">P2</text><rect x="532" y="524" width="24" height="20" rx="3" class="cell"/><rect x="559" y="524" width="24" height="20" rx="3" class="cell"/><rect x="586" y="524" width="24" height="20" rx="3" class="cell"/><rect x="613" y="524" width="24" height="20" rx="3" class="cell"/><rect x="640" y="524" width="24" height="20" rx="3" class="cell"/><rect x="667" y="524" width="24" height="20" rx="3" class="cell"/><rect x="694" y="524" width="24" height="20" rx="3" class="cell"/><rect x="721" y="524" width="24" height="20" rx="3" class="cell"/><rect x="748" y="524" width="24" height="20" rx="3" class="cell-empty"/><text x="640" y="578" class="t-sub" text-anchor="middle">key = queue_id: one queue → one partition, in order</text><rect x="490" y="620" width="300" height="150" rx="8" class="box-log"/><text x="506" y="644" class="t-title" text-anchor="start">notification failure topics</text><rect x="506" y="660" width="268" height="24" rx="4" class="row"/><text x="516" y="676" class="t-mono" text-anchor="start">retry-10s</text><text x="764" y="676" class="t-sub" text-anchor="end">3 partitions · wait 10 s</text><rect x="506" y="692" width="268" height="24" rx="4" class="row"/><text x="516" y="708" class="t-mono" text-anchor="start">retry-60s</text><text x="764" y="708" class="t-sub" text-anchor="end">3 partitions · wait 60 s</text><rect x="506" y="724" width="268" height="24" rx="4" class="row-bad"/><text x="516" y="740" class="t-mono-bad" text-anchor="start">dlq</text><text x="764" y="740" class="t-sub" text-anchor="end">1 partition · kept 30 days</text><text x="506" y="796" class="t-sub" text-anchor="start">full names: queue.events.notification-service.</text><text x="506" y="812" class="t-sub" text-anchor="start">{retry-10s, retry-60s, dlq}</text><polyline points="1040,52 1040,144" class="ln" marker-end="url(#f1a)"/><text x="1030" y="82" class="t-lbl" text-anchor="end">GET /users/{id}/notifications</text><rect x="900" y="144" width="280" height="64" rx="8" class="box-svc"/><text x="1040.0" y="173.0" class="t-title" text-anchor="middle">notification-api</text><text x="1040.0" y="191.0" class="t-sub" text-anchor="middle">FastAPI · :8001 · read model</text><polyline points="1040,208 1040,268" class="ln" marker-end="url(#f1a)"/><text x="1050" y="243" class="t-lbl" text-anchor="start">reads</text><rect x="900" y="268" width="280" height="150" rx="8" class="box-db"/><text x="916" y="292" class="t-title" text-anchor="start">notifications</text><text x="1164" y="292" class="t-sub" text-anchor="end">PostgreSQL · :5434</text><rect x="916" y="310" width="248" height="24" rx="4" class="row"/><text x="926" y="326" class="t-mono" text-anchor="start">event_id</text><text x="1154" y="326" class="t-sub" text-anchor="end">UNIQUE · idempotency</text><rect x="916" y="342" width="248" height="24" rx="4" class="row"/><text x="926" y="358" class="t-mono" text-anchor="start">status</text><text x="1154" y="358" class="t-sub" text-anchor="end">PENDING → SENT</text><rect x="916" y="374" width="248" height="24" rx="4" class="row"/><text x="926" y="390" class="t-mono" text-anchor="start">sent_at</text><text x="1154" y="390" class="t-sub" text-anchor="end">set when SMS accepted</text><polyline points="1040,466 1040,418" class="ln" marker-end="url(#f1a)"/><text x="1050" y="446" class="t-lbl" text-anchor="start">insert PENDING · mark SENT</text><rect x="900" y="466" width="280" height="64" rx="8" class="box-svc"/><text x="1040.0" y="495.0" class="t-title" text-anchor="middle">notification-worker</text><text x="1040.0" y="513.0" class="t-sub" text-anchor="middle">group notification-service · scalable</text><polyline points="790,498 900,498" class="ln" marker-end="url(#f1a)"/><text x="845" y="490" class="t-lbl" text-anchor="middle">consume</text><text x="845" y="516" class="t-sub" text-anchor="middle">commit after</text><rect x="900" y="566" width="280" height="56" rx="8" class="box-ext"/><text x="1040.0" y="591.0" class="t-title" text-anchor="middle">SMS provider</text><text x="1040.0" y="609.0" class="t-sub" text-anchor="middle">fake · SMS_FAILURE_RATE lab switch</text><polyline points="1040,530 1040,566" class="ln" marker-end="url(#f1a)"/><text x="1050" y="552" class="t-lbl" text-anchor="start">send · key = event_id</text><rect x="900" y="676" width="280" height="64" rx="8" class="box-svc"/><text x="1040.0" y="705.0" class="t-title" text-anchor="middle">notification-retry-worker</text><text x="1040.0" y="723.0" class="t-sub" text-anchor="middle">same handler · pause / seek / resume</text><polyline points="1040,676 1040,622" class="ln" marker-end="url(#f1a)"/><text x="1050" y="655" class="t-lbl" text-anchor="start">send</text><polyline points="920,530 920,548 840,548 840,672 790,672" class="ln-bad" marker-end="url(#f1b)"/><text x="834" y="600" class="t-bad" text-anchor="end">fails → park</text><polyline points="790,700 900,700" class="ln" marker-end="url(#f1a)"/><text x="845" y="693" class="t-lbl" text-anchor="middle">when due</text><polyline points="900,724 790,724" class="ln-bad" marker-end="url(#f1b)"/><text x="845" y="742" class="t-bad" text-anchor="middle">fails again</text><text x="40" y="584" class="t-grp" text-anchor="start">LEGEND</text><rect x="40" y="602" width="36" height="20" rx="5" class="box-svc"/><text x="88" y="617" class="t-lbl" text-anchor="start">our process (container)</text><rect x="40" y="632" width="36" height="20" rx="5" class="box-db"/><text x="88" y="647" class="t-lbl" text-anchor="start">database (one per service)</text><rect x="40" y="662" width="36" height="20" rx="5" class="box-log"/><text x="88" y="677" class="t-lbl" text-anchor="start">Kafka topic</text><rect x="40" y="692" width="36" height="20" rx="5" class="box-ext"/><text x="88" y="707" class="t-lbl" text-anchor="start">one-shot job or outside system</text><polyline points="40,732 76,732" class="ln" marker-end="url(#f1a)"/><text x="88" y="736" class="t-lbl" text-anchor="start">request or data flow</text><polyline points="40,758 76,758" class="ln-bad" marker-end="url(#f1b)"/><text x="88" y="762" class="t-lbl" text-anchor="start">failure path</text><text x="40" y="802" class="t-sub" text-anchor="start">Services never share a database.</text><text x="40" y="820" class="t-sub" text-anchor="start">They talk only through Kafka events.</text></svg>