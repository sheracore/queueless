<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 900" role="img" aria-label="Deposit saga sequence between the Queue Service and the Payment Service: the queue service reserves the ticket and publishes TicketReserved; the payment service charges the deposit; on approval the ticket becomes WAITING; on decline it is cancelled; on timeout it is cancelled and a late charge is refunded." class="dia"><title>Deposit saga sequence between the Queue Service and the Payment Service: the queue service reserves the ticket and publishes TicketReserved; the payment service charges the deposit; on approval the ticket becomes WAITING; on decline it is cancelled; on timeout it is cancelled and a late charge is refunded.</title><style>
.canvas{fill:#F7F8FA}
text{font-family:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;fill:#18202B}
.t-title{font-size:14px;font-weight:600}.t-sub{font-size:11px;fill:#5F6B7C;font-family:'IBM Plex Mono',ui-monospace,monospace}
.t-lbl{font-size:12px;fill:#4A5566}.t-grp{font-size:11px;letter-spacing:.12em;font-weight:600;fill:#6B7686}
.t-mono{font-size:12px;font-family:'IBM Plex Mono',ui-monospace,monospace;font-weight:600}
.t-mono-bad{font-size:12px;font-family:'IBM Plex Mono',ui-monospace,monospace;font-weight:600;fill:#C2362F}
.t-bad{font-size:12px;fill:#C2362F}.t-ok{font-size:12px;fill:#2E7D32}.t-soft{font-size:12px;fill:#6B7686}
.grp{fill:none;stroke:#C9D0DA;stroke-dasharray:6 5;stroke-width:1.2}
.box-actor{fill:#EEF1F5;stroke:#C9D0DA}
.box-svc{fill:#E8EEFC;stroke:#2F5BD3;stroke-width:1.4}.box-db{fill:#E3F2EF;stroke:#1F7A6B;stroke-width:1.4}
.box-log{fill:#FBF1DF;stroke:#B7791F;stroke-width:1.4}.box-dlq{fill:#FBE7E5;stroke:#C2362F;stroke-width:1.4}
.box-ext{fill:#F7F8FA;stroke:#6B7686;stroke-dasharray:5 4;stroke-width:1.2}
.box-final{fill:#18202B;stroke:#18202B}.box-final+text{fill:#F7F8FA}
.row{fill:#FFFFFF;stroke:#C9D0DA}.row-hl{fill:#FBF1DF;stroke:#B7791F}.row-bad{fill:#FBE7E5;stroke:#C2362F}
.cell{fill:#B7791F;opacity:.55}.cell-empty{fill:none;stroke:#B7791F;stroke-dasharray:3 3}
.ln{fill:none;stroke:#4A5566;stroke-width:1.5}.ln-bad{fill:none;stroke:#C2362F;stroke-width:1.5;stroke-dasharray:6 4}
.ln-soft{fill:none;stroke:#6B7686;stroke-width:1.3;stroke-dasharray:3 4}.ln-ok{fill:none;stroke:#2E7D32;stroke-width:1.5}
.lifeline{stroke:#C9D0DA;stroke-width:1.2;stroke-dasharray:4 4}.note{fill:#FFFFFF;stroke:#C9D0DA}.note-bad{fill:#FBE7E5;stroke:#C2362F}.alt{fill:none;stroke:#8A94A3;stroke-width:1}.alt-tab{fill:#EEF1F5;stroke:#8A94A3}
.m-ln{fill:#4A5566}.m-bad{fill:#C2362F}.m-soft{fill:#6B7686}.m-ok{fill:#2E7D32}
</style><rect width="1240" height="900" class="canvas"/><defs><marker id="f4a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="m-ln"/></marker><marker id="f4ar" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" class="m-ln"/></marker><marker id="f4b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="m-bad"/></marker><marker id="f4br" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" class="m-bad"/></marker><marker id="f4s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="m-soft"/></marker><marker id="f4sr" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" class="m-soft"/></marker><marker id="f4o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="m-ok"/></marker><marker id="f4or" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" class="m-ok"/></marker></defs><rect x="130" y="16" width="340" height="56" rx="8" class="box-svc"/><text x="300.0" y="41.0" class="t-title" text-anchor="middle">Queue Service</text><text x="300.0" y="59.0" class="t-sub" text-anchor="middle">queue-service · queue-saga-worker</text><line x1="300" y1="72" x2="300" y2="886" class="lifeline"/><rect x="770" y="16" width="340" height="56" rx="8" class="box-svc"/><text x="940.0" y="41.0" class="t-title" text-anchor="middle">Payment Service</text><text x="940.0" y="59.0" class="t-sub" text-anchor="middle">payment-worker · gateway</text><line x1="940" y1="72" x2="940" y2="886" class="lifeline"/><text x="620" y="40" class="t-sub" text-anchor="middle">events travel through Kafka:</text><text x="620" y="56" class="t-sub" text-anchor="middle">queue.events →   ← payment.events</text><rect x="90.0" y="90" width="420" height="30" rx="6" class="note"/><text x="300" y="110" class="t-lbl" text-anchor="middle">join a deposit queue → ticket RESERVED, deadline now + 5 min</text><polyline points="300,152 940,152" class="ln" marker-end="url(#f4a)"/><text x="620.0" y="145" class="t-lbl" text-anchor="middle">TicketReserved (deposit_amount)</text><rect x="730.0" y="166" width="420" height="30" rx="6" class="note"/><text x="940" y="186" class="t-lbl" text-anchor="middle">save payment PENDING, then charge (key = deposit-&lt;ticket&gt;)</text><rect x="30" y="214" width="1180" height="168" rx="6" class="alt"/><rect x="30" y="214" width="210" height="24" rx="6" class="alt-tab"/><text x="42" y="231" class="t-mono" text-anchor="start">alt  [card approved]</text><rect x="730.0" y="248" width="420" height="30" rx="6" class="note"/><text x="940" y="268" class="t-lbl" text-anchor="middle">SUCCEEDED + outbox PaymentSucceeded</text><polyline points="940,306 300,306" class="ln" marker-end="url(#f4a)"/><text x="620.0" y="299" class="t-lbl" text-anchor="middle">PaymentSucceeded</text><rect x="90.0" y="322" width="420" height="30" rx="6" class="note"/><text x="300" y="342" class="t-lbl" text-anchor="middle">RESERVED → WAITING + CustomerJoinedQueue</text><rect x="30" y="396" width="1180" height="222" rx="6" class="alt"/><rect x="30" y="396" width="210" height="24" rx="6" class="alt-tab"/><text x="42" y="413" class="t-mono" text-anchor="start">     [card declined]</text><rect x="730.0" y="430" width="420" height="30" rx="6" class="note"/><text x="940" y="450" class="t-lbl" text-anchor="middle">FAILED + outbox PaymentFailed (card_declined)</text><polyline points="940,488 300,488" class="ln-bad" marker-end="url(#f4b)"/><text x="620.0" y="481" class="t-bad" text-anchor="middle">PaymentFailed</text><rect x="90.0" y="504" width="420" height="30" rx="6" class="note-bad"/><text x="300" y="524" class="t-lbl" text-anchor="middle">compensate: RESERVED → CANCELLED (payment_declined)</text><polyline points="300,568 940,568" class="ln-bad" marker-end="url(#f4b)"/><text x="620.0" y="561" class="t-bad" text-anchor="middle">TicketReservationCancelled</text><rect x="730.0" y="578" width="420" height="30" rx="6" class="note"/><text x="940" y="598" class="t-lbl" text-anchor="middle">not charged → nothing to refund</text><rect x="30" y="632" width="1180" height="254" rx="6" class="alt"/><rect x="30" y="632" width="210" height="24" rx="6" class="alt-tab"/><text x="42" y="649" class="t-mono" text-anchor="start">     [deadline passes first]</text><rect x="90.0" y="666" width="420" height="30" rx="6" class="note-bad"/><text x="300" y="686" class="t-lbl" text-anchor="middle">timeout: RESERVED → CANCELLED (payment_timeout)</text><text x="940" y="690" class="t-sub" text-anchor="middle">(payment-worker was down; it reads queue.events in order)</text><rect x="730.0" y="706" width="420" height="30" rx="6" class="note"/><text x="940" y="726" class="t-lbl" text-anchor="middle">TicketReserved → charge → SUCCEEDED</text><polyline points="940,766 300,766" class="ln" marker-end="url(#f4a)"/><text x="620.0" y="759" class="t-lbl" text-anchor="middle">PaymentSucceeded (late)</text><rect x="90.0" y="782" width="420" height="30" rx="6" class="note"/><text x="300" y="802" class="t-lbl" text-anchor="middle">not RESERVED any more → ignore (CAS matches 0 rows)</text><rect x="730.0" y="830" width="420" height="30" rx="6" class="note-bad"/><text x="940" y="850" class="t-lbl" text-anchor="middle">TicketReservationCancelled → refund → PaymentRefunded</text><text x="940" y="878" class="t-sub" text-anchor="middle">compensation of the charge</text></svg>