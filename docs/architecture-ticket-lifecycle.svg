<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 250" role="img" aria-label="Ticket state machine: join creates WAITING; call-next moves to CALLED; serve to SERVED; leave from WAITING to LEFT; no-show from CALLED to NO_SHOW. Each move writes one event." class="dia"><title>Ticket state machine: join creates WAITING; call-next moves to CALLED; serve to SERVED; leave from WAITING to LEFT; no-show from CALLED to NO_SHOW. Each move writes one event.</title><style>
.canvas{fill:#F7F8FA}
text{font-family:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;fill:#18202B}
.t-title{font-size:14px;font-weight:600}.t-sub{font-size:11px;fill:#5F6B7C;font-family:'IBM Plex Mono',ui-monospace,monospace}
.t-lbl{font-size:12px;fill:#4A5566}.t-grp{font-size:11px;letter-spacing:.12em;font-weight:600;fill:#6B7686}
.t-mono{font-size:12px;font-family:'IBM Plex Mono',ui-monospace,monospace;font-weight:600}
.t-mono-bad{font-size:12px;font-family:'IBM Plex Mono',ui-monospace,monospace;font-weight:600;fill:#C2362F}
.t-bad{font-size:12px;fill:#C2362F}.t-ok{font-size:12px;fill:#2E7D32}.t-soft{font-size:12px;fill:#6B7686}
.grp{fill:none;stroke:#C9D0DA;stroke-dasharray:6 5;stroke-width:1.2}
.box-actor{fill:#EEF1F5;stroke:#C9D0DA}
.box-svc{fill:#E8EEFC;stroke:#2F5BD3;stroke-width:1.4}.box-db{fill:#E3F2EF;stroke:#1F7A6B;stroke-width:1.4}
.box-log{fill:#FBF1DF;stroke:#B7791F;stroke-width:1.4}.box-dlq{fill:#FBE7E5;stroke:#C2362F;stroke-width:1.4}
.box-ext{fill:#F7F8FA;stroke:#6B7686;stroke-dasharray:5 4;stroke-width:1.2}
.box-final{fill:#18202B;stroke:#18202B}.box-final+text{fill:#F7F8FA}
.row{fill:#FFFFFF;stroke:#C9D0DA}.row-hl{fill:#FBF1DF;stroke:#B7791F}.row-bad{fill:#FBE7E5;stroke:#C2362F}
.cell{fill:#B7791F;opacity:.55}.cell-empty{fill:none;stroke:#B7791F;stroke-dasharray:3 3}
.ln{fill:none;stroke:#4A5566;stroke-width:1.5}.ln-bad{fill:none;stroke:#C2362F;stroke-width:1.5;stroke-dasharray:6 4}
.ln-soft{fill:none;stroke:#6B7686;stroke-width:1.3;stroke-dasharray:3 4}.ln-ok{fill:none;stroke:#2E7D32;stroke-width:1.5}
.m-ln{fill:#4A5566}.m-bad{fill:#C2362F}.m-soft{fill:#6B7686}.m-ok{fill:#2E7D32}
</style><rect width="860" height="250" class="canvas"/><defs><marker id="f3a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="m-ln"/></marker><marker id="f3ar" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" class="m-ln"/></marker><marker id="f3b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="m-bad"/></marker><marker id="f3br" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" class="m-bad"/></marker><marker id="f3s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="m-soft"/></marker><marker id="f3sr" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" class="m-soft"/></marker><marker id="f3o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="m-ok"/></marker><marker id="f3or" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" class="m-ok"/></marker></defs><rect x="180" y="40" width="150" height="46" rx="8" class="box-svc"/><text x="255.0" y="68.0" class="t-title" text-anchor="middle">WAITING</text><rect x="440" y="40" width="150" height="46" rx="8" class="box-svc"/><text x="515.0" y="68.0" class="t-title" text-anchor="middle">CALLED</text><rect x="700" y="40" width="150" height="46" rx="8" class="box-final"/><text x="775.0" y="68.0" class="t-title" text-anchor="middle">SERVED</text><rect x="180" y="170" width="150" height="46" rx="8" class="box-final"/><text x="255.0" y="198.0" class="t-title" text-anchor="middle">LEFT</text><rect x="440" y="170" width="150" height="46" rx="8" class="box-final"/><text x="515.0" y="198.0" class="t-title" text-anchor="middle">NO_SHOW</text><polyline points="20,63 180,63" class="ln" marker-end="url(#f3a)"/><text x="100" y="55" class="t-lbl" text-anchor="middle">join</text><text x="100" y="81" class="t-sub" text-anchor="middle">CustomerJoinedQueue</text><polyline points="330,63 440,63" class="ln" marker-end="url(#f3a)"/><text x="385" y="55" class="t-lbl" text-anchor="middle">call-next</text><text x="385" y="81" class="t-sub" text-anchor="middle">CustomerCalled</text><polyline points="590,63 700,63" class="ln" marker-end="url(#f3a)"/><text x="645" y="55" class="t-lbl" text-anchor="middle">serve</text><text x="645" y="81" class="t-sub" text-anchor="middle">CustomerServed</text><polyline points="255,86 255,170" class="ln" marker-end="url(#f3a)"/><text x="265" y="124" class="t-lbl" text-anchor="start">leave</text><text x="265" y="140" class="t-sub" text-anchor="start">CustomerLeftQueue</text><polyline points="515,86 515,170" class="ln" marker-end="url(#f3a)"/><text x="525" y="124" class="t-lbl" text-anchor="start">no-show</text><text x="525" y="140" class="t-sub" text-anchor="start">CustomerMarkedNoShow</text><text x="700" y="196" class="t-sub" text-anchor="start">final states</text><text x="700" y="212" class="t-sub" text-anchor="start">(any other move → 409)</text></svg>