<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 330" role="img" aria-label="Failure routing in the notification service: a failing event moves from queue.events to retry-10s, then retry-60s, then the DLQ; permanent errors go straight to the DLQ; our own database outage is retried in place; the DLQ can be replayed into retry-10s." class="dia"><title>Failure routing in the notification service: a failing event moves from queue.events to retry-10s, then retry-60s, then the DLQ; permanent errors go straight to the DLQ; our own database outage is retried in place; the DLQ can be replayed into retry-10s.</title><style>
.canvas{fill:#F7F8FA}
text{font-family:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;fill:#18202B}
.t-title{font-size:14px;font-weight:600}.t-sub{font-size:11px;fill:#5F6B7C;font-family:'IBM Plex Mono',ui-monospace,monospace}
.t-lbl{font-size:12px;fill:#4A5566}.t-grp{font-size:11px;letter-spacing:.12em;font-weight:600;fill:#6B7686}
.t-mono{font-size:12px;font-family:'IBM Plex Mono',ui-monospace,monospace;font-weight:600}
.t-mono-bad{font-size:12px;font-family:'IBM Plex Mono',ui-monospace,monospace;font-weight:600;fill:#C2362F}
.t-bad{font-size:12px;fill:#C2362F}.t-ok{font-size:12px;fill:#2E7D32}.t-soft{font-size:12px;fill:#6B7686}
.grp{fill:none;stroke:#C9D0DA;stroke-dasharray:6 5;stroke-width:1.2}
.box-actor{fill:#EEF1F5;stroke:#C9D0DA}
.box-svc{fill:#E8EEFC;stroke:#2F5BD3;stroke-width:1.4}.box-db{fill:#E3F2EF;stroke:#1F7A6B;stroke-width:1.4}
.box-log{fill:#FBF1DF;stroke:#B7791F;stroke-width:1.4}.box-dlq{fill:#FBE7E5;stroke:#C2362F;stroke-width:1.4}
.box-ext{fill:#F7F8FA;stroke:#6B7686;stroke-dasharray:5 4;stroke-width:1.2}
.box-final{fill:#18202B;stroke:#18202B}.box-final+text{fill:#F7F8FA}
.row{fill:#FFFFFF;stroke:#C9D0DA}.row-hl{fill:#FBF1DF;stroke:#B7791F}.row-bad{fill:#FBE7E5;stroke:#C2362F}
.cell{fill:#B7791F;opacity:.55}.cell-empty{fill:none;stroke:#B7791F;stroke-dasharray:3 3}
.ln{fill:none;stroke:#4A5566;stroke-width:1.5}.ln-bad{fill:none;stroke:#C2362F;stroke-width:1.5;stroke-dasharray:6 4}
.ln-soft{fill:none;stroke:#6B7686;stroke-width:1.3;stroke-dasharray:3 4}.ln-ok{fill:none;stroke:#2E7D32;stroke-width:1.5}
.m-ln{fill:#4A5566}.m-bad{fill:#C2362F}.m-soft{fill:#6B7686}.m-ok{fill:#2E7D32}
</style><rect width="1240" height="330" class="canvas"/><defs><marker id="f2a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="m-ln"/></marker><marker id="f2ar" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" class="m-ln"/></marker><marker id="f2b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="m-bad"/></marker><marker id="f2br" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" class="m-bad"/></marker><marker id="f2s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="m-soft"/></marker><marker id="f2sr" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" class="m-soft"/></marker><marker id="f2o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="m-ok"/></marker><marker id="f2or" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" class="m-ok"/></marker></defs><rect x="20" y="100" width="130" height="60" rx="8" class="box-log"/><text x="85.0" y="127.0" class="t-title" text-anchor="middle">queue.events</text><text x="85.0" y="145.0" class="t-sub" text-anchor="middle">main topic</text><rect x="198" y="100" width="130" height="60" rx="8" class="box-svc"/><text x="263.0" y="127.0" class="t-title" text-anchor="middle">worker</text><text x="263.0" y="145.0" class="t-sub" text-anchor="middle">main group</text><rect x="376" y="100" width="130" height="60" rx="8" class="box-log"/><text x="441.0" y="127.0" class="t-title" text-anchor="middle">retry-10s</text><text x="441.0" y="145.0" class="t-sub" text-anchor="middle">wait 10 s</text><rect x="554" y="100" width="130" height="60" rx="8" class="box-svc"/><text x="619.0" y="127.0" class="t-title" text-anchor="middle">retry worker</text><text x="619.0" y="145.0" class="t-sub" text-anchor="middle">when due</text><rect x="732" y="100" width="130" height="60" rx="8" class="box-log"/><text x="797.0" y="127.0" class="t-title" text-anchor="middle">retry-60s</text><text x="797.0" y="145.0" class="t-sub" text-anchor="middle">wait 60 s</text><rect x="910" y="100" width="130" height="60" rx="8" class="box-svc"/><text x="975.0" y="127.0" class="t-title" text-anchor="middle">retry worker</text><text x="975.0" y="145.0" class="t-sub" text-anchor="middle">when due</text><rect x="1088" y="100" width="130" height="60" rx="8" class="box-dlq"/><text x="1153.0" y="127.0" class="t-title" text-anchor="middle">dlq</text><text x="1153.0" y="145.0" class="t-sub" text-anchor="middle">kept 30 days</text><polyline points="150,130 198,130" class="ln" marker-end="url(#f2a)"/><text x="174.0" y="122" class="t-lbl" text-anchor="middle">poll</text><polyline points="328,130 376,130" class="ln-bad" marker-end="url(#f2b)"/><text x="352.0" y="122" class="t-bad" text-anchor="middle">fails</text><polyline points="506,130 554,130" class="ln" marker-end="url(#f2a)"/><text x="530.0" y="122" class="t-lbl" text-anchor="middle">due</text><polyline points="684,130 732,130" class="ln-bad" marker-end="url(#f2b)"/><text x="708.0" y="122" class="t-bad" text-anchor="middle">fails</text><polyline points="862,130 910,130" class="ln" marker-end="url(#f2a)"/><text x="886.0" y="122" class="t-lbl" text-anchor="middle">due</text><polyline points="1040,130 1088,130" class="ln-bad" marker-end="url(#f2b)"/><text x="1064.0" y="122" class="t-bad" text-anchor="middle">fails</text><polyline points="263.0,100 263.0,52 1153.0,52 1153.0,100" class="ln-bad" marker-end="url(#f2b)"/><text x="708.0" y="44" class="t-bad" text-anchor="middle">PermanentError (invalid JSON, unknown event_version) → straight to the DLQ, no retries</text><polyline points="263.0,160 263.0,190" class="ln-ok" marker-end="url(#f2o)"/><text x="263.0" y="206" class="t-ok" text-anchor="middle">SMS sent · commit</text><polyline points="619.0,160 619.0,190" class="ln-ok" marker-end="url(#f2o)"/><text x="619.0" y="206" class="t-ok" text-anchor="middle">SMS sent · commit</text><polyline points="975.0,160 975.0,190" class="ln-ok" marker-end="url(#f2o)"/><text x="975.0" y="206" class="t-ok" text-anchor="middle">SMS sent · commit</text><path d="M212,160 C188,244 258,244 238,162" class="ln" marker-end="url(#f2a)"/><text x="192" y="262" class="t-lbl" text-anchor="start">own database down: wait 5 s,</text><text x="192" y="278" class="t-lbl" text-anchor="start">same offset (blocking retry)</text><polyline points="1153.0,160 1153.0,300 441.0,300 441.0,162" class="ln-soft" marker-end="url(#f2s)"/><text x="797.0" y="292" class="t-soft" text-anchor="middle">python -m app.dlq replay · messages in the DLQ now get fresh attempts</text></svg>