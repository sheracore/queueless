<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 550" role="img" aria-label="Event contracts: catalog.py is exported to contracts files; tests compare them with the models and consumers test the examples; the schema-register job checks them against the schema registry and the relays start only if all are compatible. At run time each consumer parses every message: other event types are ignored, valid events are handled, broken events go to its DLQ." class="dia"><title>Event contracts: catalog.py is exported to contracts files; tests compare them with the models and consumers test the examples; the schema-register job checks them against the schema registry and the relays start only if all are compatible. At run time each consumer parses every message: other event types are ignored, valid events are handled, broken events go to its DLQ.</title><style>
.canvas{fill:#F7F8FA}
text{font-family:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;fill:#18202B}
.t-title{font-size:14px;font-weight:600}.t-sub{font-size:11px;fill:#5F6B7C;font-family:'IBM Plex Mono',ui-monospace,monospace}
.t-lbl{font-size:12px;fill:#4A5566}.t-grp{font-size:11px;letter-spacing:.12em;font-weight:600;fill:#6B7686}
.t-mono{font-size:12px;font-family:'IBM Plex Mono',ui-monospace,monospace;font-weight:600}
.t-mono-bad{font-size:12px;font-family:'IBM Plex Mono',ui-monospace,monospace;font-weight:600;fill:#C2362F}
.t-bad{font-size:12px;fill:#C2362F}.t-ok{font-size:12px;fill:#2E7D32}.t-soft{font-size:12px;fill:#6B7686}
.grp{fill:none;stroke:#C9D0DA;stroke-dasharray:6 5;stroke-width:1.2}
.box-actor{fill:#EEF1F5;stroke:#C9D0DA}
.box-svc{fill:#E8EEFC;stroke:#2F5BD3;stroke-width:1.4}.box-db{fill:#E3F2EF;stroke:#1F7A6B;stroke-width:1.4}
.box-log{fill:#FBF1DF;stroke:#B7791F;stroke-width:1.4}.box-dlq{fill:#FBE7E5;stroke:#C2362F;stroke-width:1.4}
.box-ext{fill:#F7F8FA;stroke:#6B7686;stroke-dasharray:5 4;stroke-width:1.2}
.box-final{fill:#18202B;stroke:#18202B}.box-final+text{fill:#F7F8FA}
.row{fill:#FFFFFF;stroke:#C9D0DA}.row-hl{fill:#FBF1DF;stroke:#B7791F}.row-bad{fill:#FBE7E5;stroke:#C2362F}
.cell{fill:#B7791F;opacity:.55}.cell-empty{fill:none;stroke:#B7791F;stroke-dasharray:3 3}
.ln{fill:none;stroke:#4A5566;stroke-width:1.5}.ln-bad{fill:none;stroke:#C2362F;stroke-width:1.5;stroke-dasharray:6 4}
.ln-soft{fill:none;stroke:#6B7686;stroke-width:1.3;stroke-dasharray:3 4}.ln-ok{fill:none;stroke:#2E7D32;stroke-width:1.5}
.lifeline{stroke:#C9D0DA;stroke-width:1.2;stroke-dasharray:4 4}.note{fill:#FFFFFF;stroke:#C9D0DA}.note-bad{fill:#FBE7E5;stroke:#C2362F}.alt{fill:none;stroke:#8A94A3;stroke-width:1}.alt-tab{fill:#EEF1F5;stroke:#8A94A3}
.m-ln{fill:#4A5566}.m-bad{fill:#C2362F}.m-soft{fill:#6B7686}.m-ok{fill:#2E7D32}
</style><rect width="1240" height="550" class="canvas"/><defs><marker id="f5a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="m-ln"/></marker><marker id="f5b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="m-bad"/></marker><marker id="f5s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="m-soft"/></marker><marker id="f5o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="m-ok"/></marker></defs><text x="20" y="24" class="t-grp" text-anchor="start">BUILD AND DEPLOY TIME · FILES, TESTS, REGISTRY</text><rect x="20" y="40" width="250" height="64" rx="8" class="box-svc"/><text x="145.0" y="69.0" class="t-title" text-anchor="middle">catalog.py</text><text x="145.0" y="87.0" class="t-sub" text-anchor="middle">Pydantic models · producer owns</text><rect x="340" y="40" width="250" height="64" rx="8" class="box-db"/><text x="465.0" y="69.0" class="t-title" text-anchor="middle">contracts/ (git)</text><text x="465.0" y="87.0" class="t-sub" text-anchor="middle">*.schema.json + *.example.json</text><rect x="660" y="40" width="250" height="64" rx="8" class="box-ext"/><text x="785.0" y="69.0" class="t-title" text-anchor="middle">schema-register</text><text x="785.0" y="87.0" class="t-sub" text-anchor="middle">one-shot · compat, then register</text><rect x="980" y="40" width="240" height="64" rx="8" class="box-ext"/><text x="1100.0" y="69.0" class="t-title" text-anchor="middle">schema-registry :8081</text><text x="1100.0" y="87.0" class="t-sub" text-anchor="middle">BACKWARD · topic-EventType</text><polyline points="270,72 340,72" class="ln" marker-end="url(#f5a)"/><text x="305" y="64" class="t-lbl" text-anchor="middle">export</text><polyline points="590,72 660,72" class="ln" marker-end="url(#f5a)"/><text x="625" y="64" class="t-lbl" text-anchor="middle">deploy</text><polyline points="910,72 980,72" class="ln" marker-end="url(#f5a)"/><text x="945" y="64" class="t-lbl" text-anchor="middle">check</text><rect x="20" y="170" width="250" height="56" rx="8" class="box-actor"/><text x="145.0" y="195.0" class="t-title" text-anchor="middle">drift test (check)</text><text x="145.0" y="213.0" class="t-sub" text-anchor="middle">models == files, else exit 1</text><polyline points="100,104 100,170" class="ln" marker-end="url(#f5a)"/><text x="110" y="142" class="t-lbl" text-anchor="start">render</text><polyline points="420,104 420,140 220,140 220,170" class="ln-soft" marker-end="url(#f5s)"/><text x="300" y="134" class="t-soft" text-anchor="middle">compare</text><rect x="340" y="170" width="250" height="56" rx="8" class="box-actor"/><text x="465.0" y="195.0" class="t-title" text-anchor="middle">consumer contract tests</text><text x="465.0" y="213.0" class="t-sub" text-anchor="middle">payment · notification</text><polyline points="520,104 520,170" class="ln" marker-end="url(#f5a)"/><text x="530" y="142" class="t-lbl" text-anchor="start">examples</text><rect x="660" y="170" width="250" height="56" rx="8" class="box-svc"/><text x="785.0" y="195.0" class="t-title" text-anchor="middle">both outbox relays start</text><text x="785.0" y="213.0" class="t-sub" text-anchor="middle">service_completed_successfully</text><polyline points="760,104 760,170" class="ln-ok" marker-end="url(#f5o)"/><text x="770" y="142" class="t-ok" text-anchor="start">all OK</text><rect x="980" y="170" width="240" height="56" rx="8" class="box-dlq"/><text x="1100.0" y="195.0" class="t-title" text-anchor="middle">deployment stops</text><text x="1100.0" y="213.0" class="t-sub" text-anchor="middle">exit 1 · relays stay Created</text><polyline points="860,104 860,128 1100,128 1100,170" class="ln-bad" marker-end="url(#f5b)"/><text x="990" y="122" class="t-bad" text-anchor="middle">any FAIL</text><text x="20" y="284" class="t-grp" text-anchor="start">RUN TIME · EVERY MESSAGE, IN EACH CONSUMER (parse_or_ignore)</text><rect x="20" y="362" width="220" height="64" rx="8" class="box-log"/><text x="130.0" y="391.0" class="t-title" text-anchor="middle">queue.events</text><text x="130.0" y="409.0" class="t-sub" text-anchor="middle">or payment.events</text><rect x="300" y="362" width="240" height="64" rx="8" class="box-svc"/><text x="420.0" y="391.0" class="t-title" text-anchor="middle">parse_or_ignore()</text><text x="420.0" y="409.0" class="t-sub" text-anchor="middle">dead_letter.py</text><polyline points="240,394 300,394" class="ln" marker-end="url(#f5a)"/><text x="270" y="386" class="t-lbl" text-anchor="middle">poll</text><rect x="660" y="300" width="300" height="56" rx="8" class="box-actor"/><text x="810.0" y="325.0" class="t-title" text-anchor="middle">ignore + commit</text><text x="810.0" y="343.0" class="t-sub" text-anchor="middle">not my event type</text><rect x="660" y="366" width="300" height="56" rx="8" class="box-svc"/><text x="810.0" y="391.0" class="t-title" text-anchor="middle">handle + commit</text><text x="810.0" y="409.0" class="t-sub" text-anchor="middle">my type · version · fields OK</text><rect x="660" y="432" width="300" height="56" rx="8" class="box-dlq"/><text x="810.0" y="457.0" class="t-title" text-anchor="middle">park in DLQ + commit</text><text x="810.0" y="475.0" class="t-sub" text-anchor="middle">bad JSON · unknown version · broken</text><polyline points="540,394 600,394 600,328 660,328" class="ln-soft" marker-end="url(#f5s)"/><polyline points="600,394 660,394" class="ln-ok" marker-end="url(#f5o)"/><polyline points="600,394 600,460 660,460" class="ln-bad" marker-end="url(#f5b)"/><text x="630" y="320" class="t-soft" text-anchor="middle">None</text><text x="630" y="386" class="t-ok" text-anchor="middle">event</text><text x="594" y="478" class="t-bad" text-anchor="end">PermanentError</text><rect x="996" y="420" width="224" height="80" rx="8" class="box-log"/><text x="1010" y="442" class="t-title" text-anchor="start">DLQ topics</text><text x="1010" y="464" class="t-sub" text-anchor="start">…payment-service.dlq</text><text x="1010" y="482" class="t-sub" text-anchor="start">…queue-service-saga.dlq</text><polyline points="960,460 996,460" class="ln-bad" marker-end="url(#f5b)"/><text x="20" y="516" class="t-sub" text-anchor="start">DLQ copy = original headers + x-error + x-original-topic/partition/offset.</text><text x="20" y="532" class="t-sub" text-anchor="start">The offset is committed only after Kafka confirms the copy; if the DLQ is down, the same message is tried again.</text></svg>
