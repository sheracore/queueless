name: CI

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  queue-service-tests:
    name: Queue Service tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    defaults:
      run:
        working-directory: services/queue_service

    steps:
      - name: Check out the code
        uses: actions/checkout@v7  # Clones your repo at exactly the pushed commit into the runner.

      - name: Set up Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest -q