services:
  postgres:
    image: postgres:17
    container_name: queueless-postgres
    environment:
      POSTGRES_DB: queueless
      POSTGRES_USER: queueless
      POSTGRES_PASSWORD: queueless
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U queueless -d queueless"]
      interval: 5s
      timeout: 5s
      retries: 5

  kafka:
    image: apache/kafka:4.1.0
    container_name: queueless-kafka
    ports:
      - "9094:9094"
    environment:
      # KRaft: this one node is both the broker and the controller (no ZooKeeper).
      CLUSTER_ID: "5L6g3nShT-eMCtK--X86sw"
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      # Three doors: containers use kafka:9092, your machine uses localhost:9094,
      # 9093 is internal controller traffic.
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      # Single node: internal topics can't have 3 replicas.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # Topics are created on purpose (kafka-init), never by a typo in a producer.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      start_period: 20s
      retries: 10

  kafka-init:
    image: apache/kafka:4.1.0
    entrypoint: ["/opt/kafka/bin/kafka-topics.sh"]
    command: ["--bootstrap-server", "kafka:9092", "--create", "--if-not-exists",
              "--topic", "queue.events", "--partitions", "3", "--replication-factor", "1"]
    depends_on:
      kafka:
        condition: service_healthy
    restart: "no"

  queue-migrate:
    build: ./services/queue_service
    image: queueless/queue-service:dev
    command: ["alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: postgresql+psycopg://queueless:queueless@postgres:5432/queueless
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  queue-service:
    image: queueless/queue-service:dev
    container_name: queueless-queue-service
    environment:
      DATABASE_URL: postgresql+psycopg://queueless:queueless@postgres:5432/queueless
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      queue-migrate:
        condition: service_completed_successfully
      kafka-init:
        condition: service_completed_successfully
    restart: unless-stopped

  notification-postgres:
    image: postgres:17
    container_name: queueless-notification-postgres
    environment:
      POSTGRES_DB: notifications
      POSTGRES_USER: notification
      POSTGRES_PASSWORD: notification
    ports:
      - "5434:5432"
    volumes:
      - notification_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U notification -d notifications" ]
      interval: 5s
      timeout: 5s
      retries: 5

  notification-migrate:
    build: ./services/notification_service
    image: queueless/notification-service:dev
    command: [ "alembic", "upgrade", "head" ]
    environment:
      NOTIFICATION_DATABASE_URL: postgresql+psycopg://notification:notification@notification-postgres:5432/notifications
    depends_on:
      notification-postgres:
        condition: service_healthy
    restart: "no"

  notification-worker:
    image: queueless/notification-service:dev
    command: [ "python", "-m", "app.worker" ]
    environment:
      NOTIFICATION_DATABASE_URL: postgresql+psycopg://notification:notification@notification-postgres:5432/notifications
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      notification-migrate:
        condition: service_completed_successfully
      kafka-init:
        condition: service_completed_successfully
    stop_grace_period: 30s   # time to finish the current message after SIGTERM
    restart: unless-stopped

  notification-api:
    image: queueless/notification-service:dev
    container_name: queueless-notification-api
    command: [ "uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000" ]
    environment:
      NOTIFICATION_DATABASE_URL: postgresql+psycopg://notification:notification@notification-postgres:5432/notifications
    ports:
      - "8001:8000"
    depends_on:
      notification-migrate:
        condition: service_completed_successfully
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')" ]
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 3
    restart: unless-stopped

  kafka-ui:
    image: kafbat/kafka-ui:latest
    container_name: queueless-kafka-ui
    profiles: ["tools"]   # only starts with: docker compose --profile tools up
    environment:
      KAFKA_CLUSTERS_0_NAME: queueless
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    ports:
      - "8080:8080"
    depends_on:
      kafka:
        condition: service_healthy

volumes:
  postgres_data:
  notification_postgres_data: