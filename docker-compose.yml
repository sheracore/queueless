services:
  postgres:
    image: postgres:17
    container_name: queueless-postgres
    environment:
      POSTGRES_DB: queueless
      POSTGRES_USER: queueless
      POSTGRES_PASSWORD: queueless
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U queueless -d queueless"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: